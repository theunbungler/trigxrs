[workspace]
resolver = "2"
members = [
    "trigxrs-core",
    "trigxrs-index",
    "trigxrs-search",
    "trigxrs-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["trigxrs contributors"]
license = "Apache-2.0"
repository = "https://github.com/lonelyninja/trigxrs"

[workspace.dependencies]
# Core dependencies
memmap2 = "0.9"
regex = "1.10"
regex-syntax = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
clap = { version = "4.4", features = ["derive"] }
glob = "0.3"
unicode-segmentation = "1.10"
rayon = "1.8"
walkdir = "2.4"
thiserror = "1.0"
memchr = "2.7"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
trigxrs-core = { path = "trigxrs-core" }
trigxrs-index = { path = "trigxrs-index" }
trigxrs-search = { path = "trigxrs-search" }
